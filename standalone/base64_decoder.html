<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base64 Decoder — Observe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0e1117;
      color: #fafafa;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 760px; margin: 0 auto; }

    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .25rem; }

    .caption { color: #a0a0b0; font-size: .875rem; margin-bottom: 1.5rem; }

    label {
      display: block;
      font-size: .8rem;
      color: #c0c0d0;
      margin-bottom: .3rem;
      font-weight: 500;
    }

    textarea {
      width: 100%;
      background: #0e1117;
      border: 1px solid #3a3d55;
      border-radius: 6px;
      color: #fafafa;
      font-size: .875rem;
      font-family: monospace;
      padding: .6rem .75rem;
      outline: none;
      resize: vertical;
      min-height: 180px;
      transition: border-color .15s;
    }

    textarea:focus { border-color: #6c63ff; }
    textarea::placeholder { color: #555770; }

    button {
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: .6rem 1.4rem;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      display: block;
      width: 100%;
      margin-top: .75rem;
    }

    button:hover { background: #5a52e0; }

    .output-section { margin-top: 1.25rem; display: none; }
    .output-section.show { display: block; }

    .output-box {
      position: relative;
      background: #0e1117;
      border: 1px solid #3a3d55;
      border-radius: 6px;
      padding: .75rem;
      margin-top: .4rem;
    }

    pre {
      font-family: monospace;
      font-size: .85rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: #e0e0f0;
      margin: 0;
    }

    .copy-btn {
      position: absolute;
      top: .5rem;
      right: .5rem;
      background: #2a2d45;
      color: #c0c0d0;
      border: 1px solid #3a3d55;
      border-radius: 4px;
      padding: .25rem .6rem;
      font-size: .78rem;
      cursor: pointer;
      width: auto;
      margin: 0;
    }

    .copy-btn:hover { background: #3a3d55; color: #fff; }

    .alert {
      border-radius: 6px;
      padding: .65rem 1rem;
      font-size: .875rem;
      margin-top: .75rem;
      display: none;
    }

    .alert.error   { background: rgba(255,80,80,.15);  border: 1px solid rgba(255,80,80,.4);  color: #ff6b6b; display: block; }
    .alert.warning { background: rgba(255,180,0,.12);  border: 1px solid rgba(255,180,0,.35); color: #ffd966; display: block; }
  </style>
</head>
<body>
<div class="container">
  <h1>Base64 Decoder</h1>
  <p class="caption">Paste a base64-encoded string or an Observe copied dashboard to decode it.</p>

  <div>
    <label for="encodedInput">Encoded String</label>
    <textarea id="encodedInput" placeholder="Paste base64-encoded string or Observe dashboard here..."></textarea>
  </div>

  <button id="decodeBtn">🔓 Decode</button>

  <div class="alert" id="alertBox"></div>

  <div class="output-section" id="outputSection">
    <label>Decoded Output</label>
    <div class="output-box">
      <button class="copy-btn" id="copyBtn">Copy</button>
      <pre id="outputPre"></pre>
    </div>
  </div>
</div>

<script>
  const OBSERVE_START = "/* Observe!Start ";
  const OBSERVE_END   = " Observe!End */";

  function showAlert(type, msg) {
    const el = document.getElementById('alertBox');
    el.className = `alert ${type}`;
    el.textContent = msg;
  }

  function hideAlert() {
    const el = document.getElementById('alertBox');
    el.className = 'alert';
    el.textContent = '';
  }

  function decodeB64(b64) {
    try {
      return decodeURIComponent(escape(atob(b64)));
    } catch {
      return atob(b64);
    }
  }

  function tryPrettyJson(str) {
    try {
      return JSON.stringify(JSON.parse(str), null, 2);
    } catch {
      return str;
    }
  }

  document.getElementById('decodeBtn').addEventListener('click', () => {
    const input = document.getElementById('encodedInput').value;
    if (!input.trim()) {
      showAlert('warning', 'Paste a base64-encoded string first.');
      return;
    }
    hideAlert();

    try {
      let result;

      if (input.includes(OBSERVE_START) && input.includes(OBSERVE_END)) {
        const startIdx = input.indexOf(OBSERVE_START) + OBSERVE_START.length;
        const endIdx   = input.indexOf(OBSERVE_END);
        if (endIdx <= startIdx) throw new Error('Malformed Observe dashboard format.');
        const b64token = input.slice(startIdx, endIdx).trim();
        const decoded  = decodeB64(b64token);
        result = tryPrettyJson(decoded);
      } else {
        const decoded = decodeB64(input.trim());
        result = tryPrettyJson(decoded);
      }

      document.getElementById('outputPre').textContent = result;
      document.getElementById('outputSection').classList.add('show');
    } catch (err) {
      showAlert('error', `Failed to decode: ${err.message}`);
      document.getElementById('outputSection').classList.remove('show');
    }
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    const text = document.getElementById('outputPre').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1500);
    });
  });
</script>
</body>
</html>
