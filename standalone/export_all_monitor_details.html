<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Export All Monitor Details — Observe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1117; color: #fafafa; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .25rem; }
    .caption { color: #a0a0b0; font-size: .875rem; margin-bottom: 1.5rem; }
    code { background: #1e2130; padding: 1px 5px; border-radius: 3px; font-size: .9em; }
    .card { background: #1e2130; border: 1px solid #2e3150; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .row-3 { display: grid; grid-template-columns: 2fr 1fr 3fr; gap: .75rem; margin-bottom: .75rem; }
    label { display: block; font-size: .8rem; color: #c0c0d0; margin-bottom: .3rem; font-weight: 500; }
    input[type="text"], input[type="password"] { width: 100%; background: #0e1117; border: 1px solid #3a3d55; border-radius: 6px; color: #fafafa; font-size: .9rem; padding: .5rem .75rem; outline: none; transition: border-color .15s; }
    input:focus { border-color: #6c63ff; }
    input::placeholder { color: #555770; }
    button.primary   { background: #6c63ff; color: #fff; border: none; border-radius: 6px; padding: .55rem 1.2rem; font-size: .9rem; font-weight: 600; cursor: pointer; transition: background .15s; }
    button.primary:hover { background: #5a52e0; }
    button.primary:disabled { background: #444; cursor: not-allowed; }
    button.secondary { background: #2a2d45; color: #c0c0d0; border: 1px solid #3a3d55; border-radius: 6px; padding: .4rem .9rem; font-size: .85rem; font-weight: 500; cursor: pointer; }
    button.secondary:hover { background: #3a3d55; }
    button.full { display: block; width: 100%; margin-top: .5rem; }
    .toolbar { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: .75rem; }
    .count { color: #a0a0b0; font-size: .85rem; }
    .progress-wrap { margin: 1rem 0; }
    .progress-label { font-size: .85rem; color: #a0a0b0; margin-bottom: .35rem; }
    .progress-bar-bg { background: #1e2130; border-radius: 4px; height: 8px; overflow: hidden; border: 1px solid #2e3150; }
    .progress-bar-fill { background: #6c63ff; height: 100%; width: 0%; transition: width .2s; border-radius: 4px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th { text-align: left; padding: 7px 10px; border-bottom: 2px solid #2e3150; font-size: .75rem; font-weight: 600; color: #8080a0; white-space: nowrap; cursor: pointer; user-select: none; }
    th:hover { color: #c0c0d0; }
    td { padding: 6px 10px; border-bottom: 1px solid #1a1d2e; vertical-align: middle; }
    tr:hover td { background: #181b2a; }
    .mono { font-family: monospace; font-size: .8em; color: #a0a0b0; }
    .dim  { color: #606080; }
    .sm   { font-size: .82em; }
    .type-badge, .status-badge { padding: 2px 7px; border-radius: 10px; font-size: .75em; font-weight: 500; white-space: nowrap; }
    .type-promote   { background: rgba(79,140,255,.15); color: #79c0ff; }
    .type-anomaly   { background: rgba(180,130,255,.15);color: #d2a8ff; }
    .type-count     { background: rgba(247,120,186,.15);color: #f778ba; }
    .type-threshold { background: rgba(45,212,191,.15); color: #2dd4bf; }
    .type-other     { background: rgba(120,120,160,.15);color: #8080a0; }
    .stat-enabled   { background: rgba(0,200,100,.12);  color: #00e87a; }
    .stat-disabled  { background: rgba(255,80,80,.12);  color: #ff6b6b; }
    .post-btns { display: flex; gap: 4px; flex-wrap: nowrap; }
    .btn-curl, .btn-ps, .btn-ps2 {
      border: none; border-radius: 4px; padding: 2px 7px; font-size: .72rem; font-weight: 500;
      cursor: pointer; transition: background .15s; white-space: nowrap;
    }
    .btn-curl { background: rgba(79,140,255,.15); color: #79c0ff; }
    .btn-curl:hover { background: rgba(79,140,255,.3); }
    .btn-ps   { background: rgba(180,130,255,.15); color: #d2a8ff; }
    .btn-ps:hover   { background: rgba(180,130,255,.3); }
    .btn-curl.ok, .btn-ps.ok { background: rgba(0,200,100,.2); color: #00e87a; }
    .btn-curl.err,.btn-ps.err { background: rgba(255,80,80,.2); color: #ff6b6b; }
    .dest-icon { cursor: help; margin-right: 2px; }
    .alert { border-radius: 6px; padding: .65rem 1rem; font-size: .875rem; margin-top: .75rem; display: none; }
    .alert.error   { background: rgba(255,80,80,.15);  border: 1px solid rgba(255,80,80,.4);  color: #ff6b6b; display: block; }
    .alert.warning { background: rgba(255,180,0,.12);  border: 1px solid rgba(255,180,0,.35); color: #ffd966; display: block; }
    .alert.info    { background: rgba(80,160,255,.15); border: 1px solid rgba(80,160,255,.4); color: #7ec8ff; display: block; }
    #step1Results, #step2Section, #step2Results { display: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>Export All Monitor Details</h1>
  <p class="caption">Two-step export: fetch the monitor list, then retrieve full details for each. Uses <code>GET /v1/monitors</code> and <code>GET /v1/monitors/{id}</code></p>

  <div class="card">
    <div class="row-3">
      <div>
        <label>Customer ID</label>
        <input type="text" id="customerId" placeholder="1234567890" />
      </div>
      <div>
        <label>Domain <span style="color:#555770">(optional)</span></label>
        <input type="text" id="domain" placeholder="abc" />
      </div>
      <div>
        <label>Bearer Token</label>
        <input type="password" id="token" placeholder="Paste Observe token here" />
      </div>
    </div>
    <button class="primary full" id="fetchListBtn">Fetch Monitor List</button>
  </div>

  <div class="alert" id="alertBox"></div>

  <div id="step1Results">
    <div class="toolbar">
      <button class="primary" id="fetchDetailsBtn">⟳ Fetch All Details</button>
      <span class="count" id="listCount"></span>
    </div>
    <div class="table-wrap" id="listTable"></div>
  </div>

  <div id="step2Section">
    <div class="progress-wrap">
      <div class="progress-label" id="progressLabel">Fetching…</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    </div>
  </div>

  <div id="step2Results">
    <div class="toolbar">
      <button class="secondary" id="csvBtn">⬇ Download CSV</button>
      <button class="secondary" id="jsonBtn">⬇ Download JSON</button>
      <span class="count" id="detailCount"></span>
    </div>
    <div class="table-wrap" id="detailTable"></div>
  </div>
</div>

<script>
  let monitorList = [], detailsMap = {};
  let cid = '', dom = '', tok = '';

  function host() { return dom.trim() ? `${cid}.${dom}.observeinc.com` : `${cid}.observeinc.com`; }
  function authHdr() { return { 'Authorization': `Bearer ${cid} ${tok}`, 'Content-Type': 'application/json' }; }

  function nanoToDatetime(ns) {
    if (!ns) return '';
    try { const ms = Math.floor(Number(ns)/1e6); return new Date(ms).toLocaleString('en-US',{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',timeZoneName:'short'}); }
    catch { return String(ns); }
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── transform logic ──────────────────────────────────────────────────────
  function stripNulls(obj) {
    if (Array.isArray(obj)) return obj.map(stripNulls);
    if (obj && typeof obj==='object') return Object.fromEntries(Object.entries(obj).filter(([,v])=>v!=null).map(([k,v])=>[k,stripNulls(v)]));
    return obj;
  }
  function cleanDefinition(defn) {
    defn={...defn}; delete defn.layout;
    if (defn.inputQuery) {
      const iq={...defn.inputQuery}; delete iq.layout;
      if (Array.isArray(iq.stages)) iq.stages=iq.stages.map(s=>{
        s={...s}; delete s.layout;
        if (Array.isArray(s.input)) s.input=s.input[0];
        if (s.input&&typeof s.input==='object'){s.input={...s.input};delete s.input.datasetPath;delete s.input.stageId;}
        return s;
      });
      defn.inputQuery=iq;
    }
    return defn;
  }
  function transformActionRule(rule) {
    const out={};
    if ('definition' in rule){
      let d=stripNulls({...rule.definition}); delete d.actionId;
      if(!d.name&&d.type){if(d.type==='Email'){const a=d.email?.addresses||[];d.name=`Email ${a[0]||'action'}`;}else if(d.type==='Webhook')d.name='Webhook action';else d.name=`${d.type} action`;}
      out.definition=d;
    } else if('actionId' in rule) out.actionId=rule.actionId;
    for(const k of['levels','conditions','sendEndNotifications','sendRemindersInterval'])if(rule[k]!=null)out[k]=rule[k];
    return out;
  }
  function transformForCreate(data) {
    let body=stripNulls(JSON.parse(JSON.stringify(data)));
    for(const k of['id','monitorVersion','effectiveScheduling'])delete body[k];
    body.name=(body.name||'')+' (auto-generated)';
    if(body.definition)body.definition=cleanDefinition(body.definition);
    if(Array.isArray(body.actionRules))body.actionRules=body.actionRules.map(transformActionRule);
    const ORDER=['name','description','disabled','ruleKind','definition','actionRules'];
    const ordered={};
    ORDER.forEach(k=>{if(k in body){ordered[k]=body[k];delete body[k];}});
    return {...ordered,...body};
  }
  function buildCurl(data) {
    const body=transformForCreate(data);
    const json=JSON.stringify(body,null,2).replace(/'/g,"'\\''");
    return `curl https://${host()}/v1/monitors \\\n  --request POST \\\n  --header 'Content-Type: application/json' \\\n  --header 'Authorization: Bearer ${cid} ${tok}' \\\n  --data '${json}'`;
  }
  function buildPS(data) {
    const body=transformForCreate(data);
    const json=JSON.stringify(body,null,2).replace(/`/g,'``').replace(/'/g,"''");
    return `Invoke-RestMethod \`\n  -Uri 'https://${host()}/v1/monitors' \`\n  -Method Post \`\n  -Headers @{\n    'Content-Type' = 'application/json'\n    'Authorization' = 'Bearer ${cid} ${tok}'\n  } \`\n  -Body '${json}'`;
  }

  const ACTION_ORDER={Email:0,Webhook:1,PagerDuty:2,Slack:3};
  function destIcons(rules=[]) {
    return [...rules].sort((a,b)=>(ACTION_ORDER[a.definition?.type||'']??4)-(ACTION_ORDER[b.definition?.type||'']??4))
      .map(r=>{
        const t=r.definition?.type||'';
        const url=r.definition?.webhook?.url||r.definition?.email?.addresses?.join(',')||t||'Action';
        const em = t==='Email'?'✉':t==='PagerDuty'?'📱':t==='Webhook'?'🔗':t==='Slack'?'💬':'📣';
        return `<span class="dest-icon" title="${esc(url)}">${em}</span>`;
      }).join('') || '<span class="dim">—</span>';
  }

  function typeBadge(k) {
    const cls={Promote:'type-promote',Anomaly:'type-anomaly',Count:'type-count',Threshold:'type-threshold'}[k]||'type-other';
    return `<span class="type-badge ${cls}">${esc(k||'')}</span>`;
  }

  // ── render simple list table (step 1) ────────────────────────────────────
  function renderListTable() {
    const hdrs=['Name','Monitor ID','Description','Type','Status','Last Modified'];
    const rows=monitorList.map(m=>`<tr>
      <td>${esc(m.name)}</td><td class="mono">${esc(m.id)}</td>
      <td class="dim sm">${esc(m.description)}</td>
      <td>${typeBadge(m.ruleKind)}</td>
      <td><span class="status-badge ${m.disabled?'stat-disabled':'stat-enabled'}">${m.disabled?'Disabled':'Enabled'}</span></td>
      <td class="dim sm" style="white-space:nowrap">${esc(nanoToDatetime(m.monitorVersion))}</td>
    </tr>`).join('');
    document.getElementById('listTable').innerHTML=`<table><thead><tr>${hdrs.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
  }

  // ── render enriched details table (step 2) ────────────────────────────────
  function renderDetailTable() {
    const hdrs=['Name','Monitor ID','Description','Type','Status','Last Modified','Destinations','POST'];
    const rows=monitorList.map(m=>{
      const detail=detailsMap[m.id];
      const rules=(detail?.actionRules)||[];
      const mid=m.id;
      const postHTML=detail
        ? `<div class="post-btns"><button class="btn-curl" data-mid="${esc(mid)}">cURL</button><button class="btn-ps" data-mid="${esc(mid)}">PS</button></div>`
        : `<span class="dim sm">failed</span>`;
      return `<tr>
        <td>${esc(m.name)}</td><td class="mono">${esc(mid)}</td>
        <td class="dim sm">${esc(m.description)}</td>
        <td>${typeBadge(m.ruleKind)}</td>
        <td><span class="status-badge ${m.disabled?'stat-disabled':'stat-enabled'}">${m.disabled?'Disabled':'Enabled'}</span></td>
        <td class="sm" style="white-space:nowrap;color:#a0a0b0">${esc(nanoToDatetime(m.monitorVersion))}</td>
        <td>${destIcons(rules)}</td>
        <td>${postHTML}</td>
      </tr>`;
    }).join('');
    document.getElementById('detailTable').innerHTML=`<table><thead><tr>${hdrs.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
  }

  // ── CSV ───────────────────────────────────────────────────────────────────
  function buildCSV() {
    const hdrs=['Name','Monitor ID','Description','Type','Status','Last Modified','Destinations','GET Response (JSON)'];
    const rows=monitorList.map(m=>{
      const detail=detailsMap[m.id];
      const rules=(detail?.actionRules)||[];
      const dests=rules.map(r=>r.definition?.type||'Action').join(', ');
      return [m.name||'',m.id||'',m.description||'',m.ruleKind||'',m.disabled?'Disabled':'Enabled',
        nanoToDatetime(m.monitorVersion),dests,detail?JSON.stringify(detail):'']
        .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',');
    });
    return hdrs.join(',')+'\n'+rows.join('\n');
  }

  function showAlert(type, msg) {
    const el=document.getElementById('alertBox');
    el.className=`alert ${type}`; el.textContent=msg;
  }

  // ── Step 1: fetch list ────────────────────────────────────────────────────
  document.getElementById('fetchListBtn').addEventListener('click', async () => {
    cid=document.getElementById('customerId').value.trim();
    dom=document.getElementById('domain').value.trim();
    tok=document.getElementById('token').value.trim();
    if(!cid||!tok){showAlert('error','Customer ID and Bearer Token are required.');return;}
    document.getElementById('alertBox').className='alert';
    document.getElementById('fetchListBtn').disabled=true;
    document.getElementById('fetchListBtn').textContent='Fetching…';
    document.getElementById('step2Results').style.display='none';
    try {
      const resp=await fetch(`https://${host()}/v1/monitors`,{headers:authHdr()});
      if(!resp.ok){const t=await resp.text();throw new Error(`HTTP ${resp.status}: ${t}`);}
      const data=await resp.json();
      monitorList=Array.isArray(data)?data:[];
      detailsMap={};
      if(!monitorList.length){showAlert('info','No monitors found.');document.getElementById('step1Results').style.display='none';}
      else {
        document.getElementById('listCount').textContent=`${monitorList.length} monitor${monitorList.length!==1?'s':''}`;
        renderListTable();
        document.getElementById('step1Results').style.display='block';
      }
    } catch(e){showAlert('error',e.message);}
    document.getElementById('fetchListBtn').disabled=false;
    document.getElementById('fetchListBtn').textContent='Fetch Monitor List';
  });

  // ── Step 2: fetch all details in parallel ─────────────────────────────────
  document.getElementById('fetchDetailsBtn').addEventListener('click', async () => {
    if(!monitorList.length)return;
    document.getElementById('fetchDetailsBtn').disabled=true;
    document.getElementById('step2Section').style.display='block';
    document.getElementById('step2Results').style.display='none';
    const total=monitorList.length;
    let done=0;
    const fill=document.getElementById('progressFill');
    const label=document.getElementById('progressLabel');

    const results=await Promise.allSettled(monitorList.map(m=>
      fetch(`https://${host()}/v1/monitors/${m.id}`,{headers:authHdr()}).then(r=>r.ok?r.json():null).catch(()=>null)
    ));

    results.forEach((r,i)=>{
      const mid=monitorList[i].id;
      detailsMap[mid]=r.status==='fulfilled'?r.value:null;
      done++;
      fill.style.width=`${Math.round(100*done/total)}%`;
      label.textContent=`${done}/${total} fetched…`;
    });

    label.textContent='Done!';
    const failed=Object.values(detailsMap).filter(v=>!v).length;
    if(failed)showAlert('warning',`${failed} monitor(s) failed to fetch details.`);
    else document.getElementById('alertBox').className='alert';

    renderDetailTable();
    document.getElementById('detailCount').textContent=`${total-failed} fetched${failed?`, ${failed} failed`:''}`;
    document.getElementById('step1Results').style.display='none';
    document.getElementById('step2Results').style.display='block';
    document.getElementById('step2Section').style.display='none';
    document.getElementById('fetchDetailsBtn').disabled=false;
  });

  // ── copy cURL / PS buttons ────────────────────────────────────────────────
  document.addEventListener('click', e=>{
    const btn=e.target;
    const mid=btn.getAttribute('data-mid');
    if(!mid)return;
    const detail=detailsMap[mid];
    if(!detail)return;
    const text=btn.classList.contains('btn-curl')?buildCurl(detail):btn.classList.contains('btn-ps')?buildPS(detail):null;
    if(!text)return;
    navigator.clipboard.writeText(text).then(()=>{
      const o=btn.textContent; btn.classList.add('ok'); btn.textContent='Copied!';
      setTimeout(()=>{btn.classList.remove('ok');btn.textContent=o;},1500);
    }).catch(()=>{btn.classList.add('err');btn.textContent='Failed';setTimeout(()=>{btn.classList.remove('err');btn.textContent=btn.classList.contains('btn-curl')?'cURL':'PS';},1500);});
  });

  // ── downloads ─────────────────────────────────────────────────────────────
  document.getElementById('csvBtn').addEventListener('click',()=>{
    const blob=new Blob([buildCSV()],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='observe_all_monitor_details.csv';a.click();
  });
  document.getElementById('jsonBtn').addEventListener('click',()=>{
    const out=monitorList.map(m=>detailsMap[m.id]).filter(Boolean);
    const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='observe_all_monitor_details.json';a.click();
  });
</script>
</body>
</html>
