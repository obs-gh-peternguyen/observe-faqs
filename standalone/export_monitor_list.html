<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Export Monitor List — Observe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1117; color: #fafafa; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .25rem; }
    .caption { color: #a0a0b0; font-size: .875rem; margin-bottom: 1.5rem; }
    .card { background: #1e2130; border: 1px solid #2e3150; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .row-3 { display: grid; grid-template-columns: 2fr 1fr 3fr; gap: .75rem; margin-bottom: .75rem; }
    label { display: block; font-size: .8rem; color: #c0c0d0; margin-bottom: .3rem; font-weight: 500; }
    input[type="text"], input[type="password"] { width: 100%; background: #0e1117; border: 1px solid #3a3d55; border-radius: 6px; color: #fafafa; font-size: .9rem; padding: .5rem .75rem; outline: none; transition: border-color .15s; }
    input:focus { border-color: #6c63ff; }
    input::placeholder { color: #555770; }
    .help { font-size: .75rem; color: #555770; margin-top: .2rem; }
    button.primary { background: #6c63ff; color: #fff; border: none; border-radius: 6px; padding: .6rem 1.4rem; font-size: .95rem; font-weight: 600; cursor: pointer; transition: background .15s; width: 100%; margin-top: .5rem; }
    button.primary:hover { background: #5a52e0; }
    button.primary:disabled { background: #444; cursor: not-allowed; }
    button.secondary { background: #2a2d45; color: #c0c0d0; border: 1px solid #3a3d55; border-radius: 6px; padding: .4rem .9rem; font-size: .85rem; font-weight: 500; cursor: pointer; }
    button.secondary:hover { background: #3a3d55; }
    .toolbar { display: flex; align-items: center; gap: .75rem; margin-bottom: .75rem; }
    .count { color: #a0a0b0; font-size: .85rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    th { text-align: left; padding: 8px 12px; border-bottom: 2px solid #2e3150; font-size: .78rem; font-weight: 600; color: #8080a0; white-space: nowrap; cursor: pointer; user-select: none; }
    th:hover { color: #c0c0d0; }
    td { padding: 7px 12px; border-bottom: 1px solid #1e2130; vertical-align: middle; }
    tr:hover td { background: #181b2a; }
    .mono { font-family: monospace; font-size: .82em; color: #a0a0b0; }
    .badge-enabled  { background: rgba(0,200,100,.15); color: #00e87a; padding: 2px 8px; border-radius: 10px; font-size: .78em; font-weight: 500; }
    .badge-disabled { background: rgba(255,80,80,.15);  color: #ff6b6b; padding: 2px 8px; border-radius: 10px; font-size: .78em; font-weight: 500; }
    .badge-promote   { background: rgba(79,140,255,.15); color: #79c0ff; padding: 2px 8px; border-radius: 10px; font-size: .78em; }
    .badge-anomaly   { background: rgba(180,130,255,.15);color: #d2a8ff; padding: 2px 8px; border-radius: 10px; font-size: .78em; }
    .badge-count     { background: rgba(247,120,186,.15);color: #f778ba; padding: 2px 8px; border-radius: 10px; font-size: .78em; }
    .badge-threshold { background: rgba(45,212,191,.15); color: #2dd4bf; padding: 2px 8px; border-radius: 10px; font-size: .78em; }
    .badge-other     { background: rgba(120,120,160,.15);color: #8080a0; padding: 2px 8px; border-radius: 10px; font-size: .78em; }
    .alert { border-radius: 6px; padding: .65rem 1rem; font-size: .875rem; margin-top: .75rem; display: none; }
    .alert.error   { background: rgba(255,80,80,.15);  border: 1px solid rgba(255,80,80,.4);  color: #ff6b6b; display: block; }
    .alert.info    { background: rgba(80,160,255,.15); border: 1px solid rgba(80,160,255,.4); color: #7ec8ff; display: block; }
    #results { display: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>Export Monitor List</h1>
  <p class="caption">Fetches all monitors via the Observe v1 API: <code style="background:#1e2130;padding:1px 5px;border-radius:3px;font-size:.9em">GET /v1/monitors</code></p>

  <div class="card">
    <div class="row-3">
      <div>
        <label>Customer ID</label>
        <input type="text" id="customerId" placeholder="1234567890" />
      </div>
      <div>
        <label>Domain <span style="color:#555770">(optional)</span></label>
        <input type="text" id="domain" placeholder="abc" />
      </div>
      <div>
        <label>Bearer Token</label>
        <input type="password" id="token" placeholder="Paste Observe token here" />
      </div>
    </div>
    <button class="primary" id="fetchBtn">List Monitors</button>
  </div>

  <div class="alert" id="alertBox"></div>

  <div id="results">
    <div class="toolbar">
      <button class="secondary" id="csvBtn">⬇ Download CSV</button>
      <span class="count" id="countLabel"></span>
    </div>
    <div class="table-wrap">
      <table id="monitorTable">
        <thead>
          <tr>
            <th data-col="name">Name ↕</th>
            <th data-col="id">Monitor ID ↕</th>
            <th data-col="description">Description ↕</th>
            <th data-col="ruleKind">Type ↕</th>
            <th data-col="status">Status ↕</th>
            <th data-col="lastModified">Last Modified ↕</th>
          </tr>
        </thead>
        <tbody id="monitorBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let monitorData = [];
  let sortCol = null, sortAsc = true;

  function host(cid, dom) {
    return dom.trim() ? `${cid}.${dom}.observeinc.com` : `${cid}.observeinc.com`;
  }

  function nanoToDatetime(ns) {
    if (!ns) return '';
    try {
      const ms = Math.floor(Number(ns) / 1e6);
      return new Date(ms).toLocaleString('en-US', { year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', timeZoneName:'short' });
    } catch { return String(ns); }
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function typeBadge(k) {
    const cls = {Promote:'promote',Anomaly:'anomaly',Count:'count',Threshold:'threshold'}[k] || 'other';
    return `<span class="badge-${cls}">${esc(k||'')}</span>`;
  }

  function showAlert(type, msg) {
    const el = document.getElementById('alertBox');
    el.className = `alert ${type}`;
    el.textContent = msg;
  }

  function renderTable() {
    const tbody = document.getElementById('monitorBody');
    tbody.innerHTML = monitorData.map(m => `
      <tr>
        <td>${esc(m.name)}</td>
        <td class="mono">${esc(m.id)}</td>
        <td style="color:#a0a0b0;font-size:.85em">${esc(m.description)}</td>
        <td>${typeBadge(m.ruleKind)}</td>
        <td><span class="badge-${m.disabled?'disabled':'enabled'}">${m.disabled?'Disabled':'Enabled'}</span></td>
        <td style="font-size:.85em;color:#a0a0b0;white-space:nowrap">${esc(nanoToDatetime(m.monitorVersion))}</td>
      </tr>`).join('');
  }

  function buildCSV(monitors) {
    const headers = ['Name','Monitor ID','Description','Monitor Type','Status','Last Modified'];
    const rows = monitors.map(m => [
      m.name||'', m.id||'', m.description||'', m.ruleKind||'',
      m.disabled ? 'Disabled' : 'Enabled',
      nanoToDatetime(m.monitorVersion)
    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
    return headers.join(',') + '\n' + rows.join('\n');
  }

  document.getElementById('fetchBtn').addEventListener('click', async () => {
    const cid = document.getElementById('customerId').value.trim();
    const dom = document.getElementById('domain').value.trim();
    const tok = document.getElementById('token').value.trim();
    if (!cid || !tok) { showAlert('error', 'Customer ID and Bearer Token are required.'); return; }
    document.getElementById('alertBox').className = 'alert';
    document.getElementById('fetchBtn').disabled = true;
    document.getElementById('fetchBtn').textContent = 'Fetching…';
    try {
      const resp = await fetch(`https://${host(cid,dom)}/v1/monitors`, {
        headers: { 'Authorization': `Bearer ${cid} ${tok}`, 'Content-Type': 'application/json' }
      });
      if (!resp.ok) { const t = await resp.text(); throw new Error(`HTTP ${resp.status}: ${t}`); }
      const data = await resp.json();
      monitorData = Array.isArray(data) ? data : [];
      if (!monitorData.length) { showAlert('info', 'No monitors found.'); document.getElementById('results').style.display='none'; }
      else {
        document.getElementById('countLabel').textContent = `${monitorData.length} result${monitorData.length!==1?'s':''}`;
        renderTable();
        document.getElementById('results').style.display = 'block';
      }
    } catch(e) { showAlert('error', e.message); }
    document.getElementById('fetchBtn').disabled = false;
    document.getElementById('fetchBtn').textContent = 'List Monitors';
  });

  document.getElementById('csvBtn').addEventListener('click', () => {
    if (!monitorData.length) return;
    const blob = new Blob([buildCSV(monitorData)], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'observe_monitors.csv'; a.click();
  });

  document.querySelectorAll('th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) sortAsc = !sortAsc; else { sortCol = col; sortAsc = true; }
      monitorData.sort((a, b) => {
        let av = col === 'status' ? (a.disabled?'Disabled':'Enabled') : col === 'lastModified' ? (a.monitorVersion||0) : (a[col]||'');
        let bv = col === 'status' ? (b.disabled?'Disabled':'Enabled') : col === 'lastModified' ? (b.monitorVersion||0) : (b[col]||'');
        if (typeof av === 'string') av = av.toLowerCase(); if (typeof bv === 'string') bv = bv.toLowerCase();
        return sortAsc ? (av < bv ? -1 : av > bv ? 1 : 0) : (av > bv ? -1 : av < bv ? 1 : 0);
      });
      renderTable();
    });
  });
</script>
</body>
</html>
