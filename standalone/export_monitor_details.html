<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Export Monitor Details — Observe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1117; color: #fafafa; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .25rem; }
    .caption { color: #a0a0b0; font-size: .875rem; margin-bottom: 1.5rem; }
    code { background: #1e2130; padding: 1px 5px; border-radius: 3px; font-size: .9em; }
    .card { background: #1e2130; border: 1px solid #2e3150; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .row-4 { display: grid; grid-template-columns: 2fr 1fr 1fr 3fr; gap: .75rem; margin-bottom: .75rem; }
    label { display: block; font-size: .8rem; color: #c0c0d0; margin-bottom: .3rem; font-weight: 500; }
    input[type="text"], input[type="password"] { width: 100%; background: #0e1117; border: 1px solid #3a3d55; border-radius: 6px; color: #fafafa; font-size: .9rem; padding: .5rem .75rem; outline: none; transition: border-color .15s; }
    input:focus { border-color: #6c63ff; }
    input::placeholder { color: #555770; }
    button.primary { background: #6c63ff; color: #fff; border: none; border-radius: 6px; padding: .6rem 1.4rem; font-size: .95rem; font-weight: 600; cursor: pointer; transition: background .15s; width: 100%; margin-top: .5rem; }
    button.primary:hover { background: #5a52e0; }
    button.primary:disabled { background: #444; cursor: not-allowed; }
    .meta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; margin-bottom: 1.25rem; }
    .meta-cell { background: #1e2130; border: 1px solid #2e3150; border-radius: 6px; padding: .75rem; }
    .meta-label { font-size: .75rem; color: #8080a0; margin-bottom: .3rem; }
    .meta-value { font-size: .9rem; font-family: monospace; }
    .badge-enabled  { color: #00e87a; } .badge-disabled { color: #ff6b6b; }
    .monitor-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; }
    .tabs { display: flex; gap: .25rem; border-bottom: 1px solid #2e3150; margin-bottom: 1rem; }
    .tab-btn { background: none; border: none; color: #8080a0; font-size: .9rem; padding: .5rem 1rem; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s; }
    .tab-btn.active { color: #6c63ff; border-bottom-color: #6c63ff; }
    .tab-btn:hover { color: #c0c0d0; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .code-wrap { position: relative; }
    pre { background: #1e2130; border: 1px solid #2e3150; border-radius: 6px; padding: 1rem; font-family: monospace; font-size: .82rem; white-space: pre-wrap; word-break: break-word; color: #e0e0f0; overflow-x: auto; max-height: 60vh; overflow-y: auto; }
    .copy-btn { position: absolute; top: .5rem; right: .5rem; background: #2a2d45; color: #c0c0d0; border: 1px solid #3a3d55; border-radius: 4px; padding: .25rem .6rem; font-size: .78rem; cursor: pointer; }
    .copy-btn:hover { background: #3a3d55; }
    .alert { border-radius: 6px; padding: .65rem 1rem; font-size: .875rem; margin-top: .75rem; display: none; }
    .alert.error { background: rgba(255,80,80,.15); border: 1px solid rgba(255,80,80,.4); color: #ff6b6b; display: block; }
    #results { display: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>Export Monitor Details</h1>
  <p class="caption">Fetches a single monitor by ID and generates a curl command to recreate it: <code>GET /v1/monitors/{id}</code></p>

  <div class="card">
    <div class="row-4">
      <div>
        <label>Customer ID</label>
        <input type="text" id="customerId" placeholder="1234567890" />
      </div>
      <div>
        <label>Domain <span style="color:#555770">(optional)</span></label>
        <input type="text" id="domain" placeholder="abc" />
      </div>
      <div>
        <label>Monitor ID</label>
        <input type="text" id="monitorId" placeholder="12345678" />
      </div>
      <div>
        <label>Bearer Token</label>
        <input type="password" id="token" placeholder="Paste Observe token here" />
      </div>
    </div>
    <button class="primary" id="fetchBtn">Get Monitor</button>
  </div>

  <div class="alert" id="alertBox"></div>

  <div id="results">
    <div class="monitor-name" id="monitorName"></div>
    <div class="meta-grid">
      <div class="meta-cell"><div class="meta-label">Monitor ID</div><div class="meta-value" id="metaId"></div></div>
      <div class="meta-cell"><div class="meta-label">Kind</div><div class="meta-value" id="metaKind"></div></div>
      <div class="meta-cell"><div class="meta-label">Status</div><div class="meta-value" id="metaStatus"></div></div>
      <div class="meta-cell"><div class="meta-label">Action Rules</div><div class="meta-value" id="metaActions" style="font-family:sans-serif;font-size:.85rem"></div></div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="json">GET /v1/monitors/{id}</button>
      <button class="tab-btn" data-tab="curl">POST /v1/monitors (recreate)</button>
    </div>
    <div id="tab-json" class="tab-panel active">
      <div class="code-wrap">
        <button class="copy-btn" id="copyJson">Copy</button>
        <pre id="jsonPre"></pre>
      </div>
    </div>
    <div id="tab-curl" class="tab-panel">
      <div class="code-wrap">
        <button class="copy-btn" id="copyCurl">Copy</button>
        <pre id="curlPre"></pre>
      </div>
    </div>
  </div>
</div>

<script>
  function host(cid, dom) { return dom.trim() ? `${cid}.${dom}.observeinc.com` : `${cid}.observeinc.com`; }

  // ── transform logic (mirrors Python) ──────────────────────────────────────
  function stripNulls(obj) {
    if (Array.isArray(obj)) return obj.map(stripNulls);
    if (obj && typeof obj === 'object') {
      return Object.fromEntries(Object.entries(obj).filter(([,v])=>v!=null).map(([k,v])=>[k,stripNulls(v)]));
    }
    return obj;
  }

  function cleanDefinition(defn) {
    defn = {...defn};
    delete defn.layout;
    if (defn.inputQuery) {
      const iq = {...defn.inputQuery};
      delete iq.layout;
      if (Array.isArray(iq.stages)) {
        iq.stages = iq.stages.map(s => {
          s = {...s};
          delete s.layout;
          if (Array.isArray(s.input)) s.input = s.input[0];
          if (s.input && typeof s.input === 'object') {
            s.input = {...s.input};
            delete s.input.datasetPath;
            delete s.input.stageId;
          }
          return s;
        });
      }
      defn.inputQuery = iq;
    }
    return defn;
  }

  function transformActionRule(rule) {
    const out = {};
    if ('definition' in rule) {
      let d = stripNulls({...rule.definition});
      delete d.actionId;
      if (!d.name && d.type) {
        if (d.type === 'Email') { const a = d.email?.addresses||[]; d.name = `Email ${a[0]||'action'}`; }
        else if (d.type === 'Webhook') d.name = 'Webhook action';
        else d.name = `${d.type} action`;
      }
      out.definition = d;
    } else if ('actionId' in rule) {
      out.actionId = rule.actionId;
    }
    for (const k of ['levels','conditions','sendEndNotifications','sendRemindersInterval']) {
      if (rule[k] != null) out[k] = rule[k];
    }
    return out;
  }

  function transformForCreate(data) {
    let body = stripNulls(JSON.parse(JSON.stringify(data)));
    for (const k of ['id','monitorVersion','effectiveScheduling']) delete body[k];
    body.name = (body.name||'') + ' (auto-generated)';
    if (body.definition) body.definition = cleanDefinition(body.definition);
    if (Array.isArray(body.actionRules)) body.actionRules = body.actionRules.map(transformActionRule);
    const ORDER = ['name','description','disabled','ruleKind','definition','actionRules'];
    const ordered = {};
    ORDER.forEach(k => { if (k in body) { ordered[k] = body[k]; delete body[k]; } });
    return {...ordered, ...body};
  }

  function buildCurl(data, cid, dom, tok) {
    const h = host(cid, dom);
    const body = transformForCreate(data);
    const json = JSON.stringify(body, null, 2).replace(/'/g, "'\\''");
    return `curl https://${h}/v1/monitors \\\n  --request POST \\\n  --header 'Content-Type: application/json' \\\n  --header 'Authorization: Bearer ${cid} ${tok}' \\\n  --data '${json}'`;
  }

  const ACTION_ORDER = {Email:0, Webhook:1, PagerDuty:2, Slack:3};
  function actionLabel(rule) {
    const defn = rule.definition||{};
    const t = defn.type||'';
    if (t === 'Email') { const a = defn.email?.addresses||[]; return `✉ ${a[0]||'Email'}`; }
    if (t === 'PagerDuty') return `📱 PagerDuty`;
    if (t === 'Webhook') return `🔗 ${defn.webhook?.url||'Webhook'}`;
    if (t === 'Slack') return `💬 ${defn.webhook?.url||'Slack'}`;
    return `📣 ${defn.name||t||'Action'}`;
  }

  function showAlert(type, msg) {
    const el = document.getElementById('alertBox');
    el.className = `alert ${type}`;
    el.textContent = msg;
  }

  let curlText = '', jsonText = '';

  document.getElementById('fetchBtn').addEventListener('click', async () => {
    const cid = document.getElementById('customerId').value.trim();
    const dom = document.getElementById('domain').value.trim();
    const mid = document.getElementById('monitorId').value.trim();
    const tok = document.getElementById('token').value.trim();
    if (!cid || !mid || !tok) { showAlert('error', 'Customer ID, Monitor ID, and Bearer Token are required.'); return; }
    document.getElementById('alertBox').className = 'alert';
    document.getElementById('fetchBtn').disabled = true;
    document.getElementById('fetchBtn').textContent = 'Fetching…';
    try {
      const resp = await fetch(`https://${host(cid,dom)}/v1/monitors/${mid}`, {
        headers: { 'Authorization': `Bearer ${cid} ${tok}`, 'Content-Type': 'application/json' }
      });
      if (!resp.ok) { const t = await resp.text(); throw new Error(`HTTP ${resp.status}: ${t}`); }
      const data = await resp.json();
      jsonText = JSON.stringify(data, null, 2);
      curlText = buildCurl(data, cid, dom, tok);
      document.getElementById('monitorName').textContent = data.name || 'Unknown';
      document.getElementById('metaId').textContent = data.id || '';
      document.getElementById('metaKind').textContent = data.ruleKind || '';
      const statusEl = document.getElementById('metaStatus');
      statusEl.textContent = data.disabled ? 'disabled' : 'enabled';
      statusEl.className = `meta-value badge-${data.disabled?'disabled':'enabled'}`;
      const rules = (data.actionRules||[]).sort((a,b)=>(ACTION_ORDER[a.definition?.type||'']??4)-(ACTION_ORDER[b.definition?.type||'']??4));
      document.getElementById('metaActions').innerHTML = rules.length ? rules.map(r=>`<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${(r.definition?.webhook?.url||'')||''}">${actionLabel(r)}</div>`).join('') : '—';
      document.getElementById('jsonPre').textContent = jsonText;
      document.getElementById('curlPre').textContent = curlText;
      document.getElementById('results').style.display = 'block';
    } catch(e) { showAlert('error', e.message); }
    document.getElementById('fetchBtn').disabled = false;
    document.getElementById('fetchBtn').textContent = 'Get Monitor';
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
    });
  });

  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => { const o = btn.textContent; btn.textContent = 'Copied!'; setTimeout(()=>btn.textContent=o, 1500); });
  }
  document.getElementById('copyJson').addEventListener('click', e => copyText(jsonText, e.target));
  document.getElementById('copyCurl').addEventListener('click', e => copyText(curlText, e.target));
</script>
</body>
</html>
