<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Export Dataset — Observe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1117; color: #fafafa; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .25rem; }
    .caption { color: #a0a0b0; font-size: .875rem; margin-bottom: 1.5rem; }
    code { background: #1e2130; padding: 1px 5px; border-radius: 3px; font-size: .9em; }
    .card { background: #1e2130; border: 1px solid #2e3150; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .row-3 { display: grid; grid-template-columns: 2fr 1fr 3fr; gap: .75rem; margin-bottom: .75rem; }
    label { display: block; font-size: .8rem; color: #c0c0d0; margin-bottom: .3rem; font-weight: 500; }
    input[type="text"], input[type="password"] { width: 100%; background: #0e1117; border: 1px solid #3a3d55; border-radius: 6px; color: #fafafa; font-size: .9rem; padding: .5rem .75rem; outline: none; transition: border-color .15s; }
    input:focus { border-color: #6c63ff; }
    input::placeholder { color: #555770; }
    button.primary { background: #6c63ff; color: #fff; border: none; border-radius: 6px; padding: .6rem 1.4rem; font-size: .95rem; font-weight: 600; cursor: pointer; transition: background .15s; width: 100%; margin-top: .5rem; }
    button.primary:hover { background: #5a52e0; }
    button.primary:disabled { background: #444; cursor: not-allowed; }
    button.secondary { background: #2a2d45; color: #c0c0d0; border: 1px solid #3a3d55; border-radius: 6px; padding: .4rem .9rem; font-size: .85rem; font-weight: 500; cursor: pointer; }
    button.secondary:hover { background: #3a3d55; }
    .toolbar { display: flex; align-items: center; gap: .75rem; margin-bottom: .75rem; }
    .count { color: #a0a0b0; font-size: .85rem; }
    .search-input { background: #1e2130; border: 1px solid #2e3150; border-radius: 6px; color: #fafafa; padding: .4rem .75rem; font-size: .85rem; outline: none; width: 220px; }
    .search-input:focus { border-color: #6c63ff; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th { text-align: left; padding: 7px 10px; border-bottom: 2px solid #2e3150; font-size: .75rem; font-weight: 600; color: #8080a0; white-space: nowrap; cursor: pointer; user-select: none; }
    th:hover { color: #c0c0d0; }
    td { padding: 6px 10px; border-bottom: 1px solid #1e2130; vertical-align: middle; }
    tr:hover td { background: #181b2a; }
    .mono { font-family: monospace; font-size: .82em; color: #a0a0b0; }
    .dim { color: #606080; font-size: .85em; }
    .alert { border-radius: 6px; padding: .65rem 1rem; font-size: .875rem; margin-top: .75rem; display: none; }
    .alert.error { background: rgba(255,80,80,.15); border: 1px solid rgba(255,80,80,.4); color: #ff6b6b; display: block; }
    .alert.info  { background: rgba(80,160,255,.15); border: 1px solid rgba(80,160,255,.4); color: #7ec8ff; display: block; }
    #results { display: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>Export Dataset <span style="font-size:.75em;color:#8080a0">(Legacy)</span></h1>
  <p class="caption">Fetches all datasets via the Observe v1 API: <code>GET /v1/dataset</code> (legacy)</p>

  <div class="card">
    <div class="row-3">
      <div>
        <label>Customer ID</label>
        <input type="text" id="customerId" placeholder="1234567890" />
      </div>
      <div>
        <label>Domain <span style="color:#555770">(optional)</span></label>
        <input type="text" id="domain" placeholder="abc" />
      </div>
      <div>
        <label>Bearer Token</label>
        <input type="password" id="token" placeholder="Paste Observe token here" />
      </div>
    </div>
    <button class="primary" id="fetchBtn">List Datasets</button>
  </div>

  <div class="alert" id="alertBox"></div>

  <div id="results">
    <div class="toolbar">
      <button class="secondary" id="csvBtn">⬇ Download CSV</button>
      <input type="text" class="search-input" id="searchInput" placeholder="Filter…" />
      <span class="count" id="countLabel"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-col="id">ID ↕</th>
            <th data-col="workspaceId">Workspace ID ↕</th>
            <th data-col="name">Name ↕</th>
            <th data-col="kind">Kind ↕</th>
            <th data-col="labelField">Label Field ↕</th>
            <th data-col="primaryKey">Primary Key ↕</th>
            <th data-col="urlPath">URL Path ↕</th>
            <th data-col="createdBy">Created By ↕</th>
            <th data-col="createdDate">Created Date ↕</th>
            <th data-col="updatedBy">Updated By ↕</th>
            <th data-col="updatedDate">Updated Date ↕</th>
          </tr>
        </thead>
        <tbody id="datasetBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let allDatasets = [], sortCol = null, sortAsc = true, filterText = '';

  function host(cid, dom) { return dom.trim() ? `${cid}.${dom}.observeinc.com` : `${cid}.observeinc.com`; }

  function getN(obj, path) { return path.split('.').reduce((o,k)=>o?.[k], obj); }

  function isoToStr(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleString('en-US', { year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', timeZoneName:'short' }); }
    catch { return iso; }
  }

  function parseDatasets(raw) {
    return (Array.isArray(raw) ? raw : []).map(d => {
      const pk = getN(d,'config.primaryKey');
      return {
        id:          getN(d,'meta.id')||'',
        workspaceId: getN(d,'meta.workspaceId')||'',
        customerId:  getN(d,'meta.customerId')||'',
        name:        getN(d,'config.name')||'',
        labelField:  getN(d,'config.labelField')||'',
        primaryKey:  Array.isArray(pk) ? pk.join(', ') : (pk||''),
        urlPath:     getN(d,'state.urlPath')||'',
        kind:        getN(d,'state.kind')||'',
        createdBy:   getN(d,'state.createdBy')||'',
        createdDate: isoToStr(getN(d,'state.createdDate')),
        updatedBy:   getN(d,'state.updatedBy')||'',
        updatedDate: isoToStr(getN(d,'state.updatedDate')),
      };
    });
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function filtered() {
    if (!filterText) return allDatasets;
    const q = filterText.toLowerCase();
    return allDatasets.filter(d => Object.values(d).some(v=>String(v).toLowerCase().includes(q)));
  }

  function renderTable() {
    const rows = filtered();
    document.getElementById('countLabel').textContent = `${rows.length} result${rows.length!==1?'s':''}${filterText?' (filtered)':''}`;
    document.getElementById('datasetBody').innerHTML = rows.map(d => `
      <tr>
        <td class="mono">${esc(d.id)}</td>
        <td class="mono">${esc(d.workspaceId)}</td>
        <td>${esc(d.name)}</td>
        <td class="dim">${esc(d.kind)}</td>
        <td class="dim">${esc(d.labelField)}</td>
        <td class="dim">${esc(d.primaryKey)}</td>
        <td class="dim" style="font-size:.8em">${esc(d.urlPath)}</td>
        <td class="dim">${esc(d.createdBy)}</td>
        <td class="dim" style="white-space:nowrap">${esc(d.createdDate)}</td>
        <td class="dim">${esc(d.updatedBy)}</td>
        <td class="dim" style="white-space:nowrap">${esc(d.updatedDate)}</td>
      </tr>`).join('');
  }

  function buildCSV(datasets) {
    const cols = ['id','workspaceId','customerId','name','labelField','primaryKey','urlPath','kind','createdBy','createdDate','updatedBy','updatedDate'];
    const hdrs = ['ID','Workspace ID','Customer ID','Name','Label Field','Primary Key','URL Path','Kind','Created By','Created Date','Updated By','Updated Date'];
    const rows = datasets.map(d => cols.map(k=>`"${String(d[k]||'').replace(/"/g,'""')}"`).join(','));
    return hdrs.join(',') + '\n' + rows.join('\n');
  }

  function showAlert(type, msg) {
    const el = document.getElementById('alertBox');
    el.className = `alert ${type}`;
    el.textContent = msg;
  }

  document.getElementById('fetchBtn').addEventListener('click', async () => {
    const cid = document.getElementById('customerId').value.trim();
    const dom = document.getElementById('domain').value.trim();
    const tok = document.getElementById('token').value.trim();
    if (!cid || !tok) { showAlert('error', 'Customer ID and Bearer Token are required.'); return; }
    document.getElementById('alertBox').className = 'alert';
    document.getElementById('fetchBtn').disabled = true;
    document.getElementById('fetchBtn').textContent = 'Fetching…';
    try {
      const resp = await fetch(`https://${host(cid,dom)}/v1/dataset`, {
        headers: { 'Authorization': `Bearer ${cid} ${tok}`, 'Content-Type': 'application/json' }
      });
      if (!resp.ok) { const t = await resp.text(); throw new Error(`HTTP ${resp.status}: ${t}`); }
      const body = await resp.json();
      const raw = typeof body === 'object' && !Array.isArray(body) ? (body.data||[]) : body;
      allDatasets = parseDatasets(raw);
      if (!allDatasets.length) { showAlert('info', 'No datasets found.'); document.getElementById('results').style.display='none'; }
      else { renderTable(); document.getElementById('results').style.display = 'block'; }
    } catch(e) { showAlert('error', e.message); }
    document.getElementById('fetchBtn').disabled = false;
    document.getElementById('fetchBtn').textContent = 'List Datasets';
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    filterText = e.target.value;
    if (allDatasets.length) renderTable();
  });

  document.getElementById('csvBtn').addEventListener('click', () => {
    if (!allDatasets.length) return;
    const blob = new Blob([buildCSV(allDatasets)], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'observe_datasets.csv'; a.click();
  });

  document.querySelectorAll('th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) sortAsc = !sortAsc; else { sortCol = col; sortAsc = true; }
      allDatasets.sort((a,b) => {
        const av = (a[col]||'').toLowerCase(), bv = (b[col]||'').toLowerCase();
        return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
      });
      renderTable();
    });
  });
</script>
</body>
</html>
