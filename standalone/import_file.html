<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Import File — Observe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0e1117;
      color: #fafafa;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: .25rem;
    }

    .caption {
      color: #a0a0b0;
      font-size: .875rem;
      margin-bottom: 1.5rem;
    }

    .card {
      background: #1e2130;
      border: 1px solid #2e3150;
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .row {
      display: grid;
      gap: .75rem;
      margin-bottom: .75rem;
    }

    .row-3 { grid-template-columns: 2fr 1fr 3fr; }
    .row-2 { grid-template-columns: 1fr 1fr; }

    label {
      display: block;
      font-size: .8rem;
      color: #c0c0d0;
      margin-bottom: .3rem;
      font-weight: 500;
    }

    input[type="text"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      background: #0e1117;
      border: 1px solid #3a3d55;
      border-radius: 6px;
      color: #fafafa;
      font-size: .9rem;
      padding: .5rem .75rem;
      outline: none;
      transition: border-color .15s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus,
    textarea:focus {
      border-color: #6c63ff;
    }

    input::placeholder, textarea::placeholder { color: #555770; }

    select option { background: #1e2130; }

    .radio-group {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: .4rem;
      cursor: pointer;
      font-size: .9rem;
      color: #fafafa;
      margin: 0;
    }

    input[type="radio"] { accent-color: #6c63ff; }

    .input-panel { display: none; }
    .input-panel.active { display: block; }

    textarea { resize: vertical; min-height: 200px; font-family: monospace; }

    .file-drop {
      border: 2px dashed #3a3d55;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      color: #a0a0b0;
      font-size: .9rem;
      transition: border-color .2s, background .2s;
    }

    .file-drop:hover, .file-drop.dragover {
      border-color: #6c63ff;
      background: rgba(108, 99, 255, .07);
    }

    .file-drop input[type="file"] { display: none; }

    .file-name {
      margin-top: .6rem;
      font-size: .85rem;
      color: #6c63ff;
    }

    button[type="submit"] {
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: .6rem 1.4rem;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      display: block;
      width: 100%;
      margin-top: .5rem;
    }

    button[type="submit"]:hover { background: #5a52e0; }
    button[type="submit"]:disabled { background: #444; cursor: not-allowed; }

    .alert {
      border-radius: 6px;
      padding: .75rem 1rem;
      font-size: .9rem;
      margin-top: 1rem;
      display: none;
    }

    .alert.success { background: rgba(0,200,100,.15); border: 1px solid rgba(0,200,100,.4); color: #00e87a; }
    .alert.error   { background: rgba(255,80,80,.15);  border: 1px solid rgba(255,80,80,.4);  color: #ff6b6b; }
    .alert.info    { background: rgba(80,160,255,.15); border: 1px solid rgba(80,160,255,.4); color: #7ec8ff; }
    .alert.show    { display: block; }

    code {
      font-family: monospace;
      font-size: .85em;
      background: rgba(255,255,255,.08);
      padding: .1em .35em;
      border-radius: 3px;
    }

    .help { font-size: .78rem; color: #707090; margin-top: .25rem; }
  </style>
</head>
<body>
<div class="container">
  <h1>Import File</h1>
  <p class="caption">Send data to Observe via HTTP ingest endpoint: <code>POST /v1/http</code></p>

  <div class="card">
    <div class="row row-3">
      <div>
        <label for="customerId">Customer ID</label>
        <input type="text" id="customerId" placeholder="1234567890" autocomplete="off" />
      </div>
      <div>
        <label for="domain">Domain <span style="color:#555770">(optional)</span></label>
        <input type="text" id="domain" placeholder="collect" autocomplete="off" />
        <p class="help">Defaults to <code>collect</code></p>
      </div>
      <div>
        <label for="token">Bearer Token</label>
        <input type="password" id="token" placeholder="Paste Observe token here" autocomplete="off" />
      </div>
    </div>
    <div>
      <label for="contentType">Content Type</label>
      <select id="contentType">
        <option>application/json</option>
        <option>application/x-ndjson</option>
        <option>application/xml</option>
        <option>application/msgpack</option>
        <option>text/csv</option>
        <option>application/x-csv</option>
        <option>text/plain</option>
      </select>
    </div>
  </div>

  <div class="radio-group">
    <label><input type="radio" name="method" value="file" checked /> File Upload</label>
    <label><input type="radio" name="method" value="url" /> URL</label>
    <label><input type="radio" name="method" value="paste" /> Paste Contents</label>
  </div>

  <div id="panel-file" class="input-panel active">
    <div class="file-drop" id="fileDrop">
      <input type="file" id="fileInput" />
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:.5rem;opacity:.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <div>Drag &amp; drop a file here, or <strong style="color:#6c63ff">click to browse</strong></div>
      <div class="file-name" id="fileName"></div>
    </div>
  </div>

  <div id="panel-url" class="input-panel">
    <label for="urlInput">Public File URL</label>
    <input type="text" id="urlInput" placeholder="https://example.com/data.json" />
    <p class="help">Note: the remote server must allow cross-origin requests (CORS).</p>
  </div>

  <div id="panel-paste" class="input-panel">
    <label for="pasteInput">Paste data here</label>
    <textarea id="pasteInput" placeholder="Paste your data here..."></textarea>
  </div>

  <button type="submit" id="submitBtn">Submit</button>

  <div class="alert" id="statusMsg"></div>
</div>

<script>
  const $ = id => document.getElementById(id);

  const panels = { file: $('panel-file'), url: $('panel-url'), paste: $('panel-paste') };
  document.querySelectorAll('input[name="method"]').forEach(r => {
    r.addEventListener('change', () => {
      Object.entries(panels).forEach(([k, el]) => el.classList.toggle('active', k === r.value));
    });
  });

  const fileDrop = $('fileDrop');
  const fileInput = $('fileInput');
  let selectedFile = null;

  fileDrop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    selectedFile = fileInput.files[0] || null;
    $('fileName').textContent = selectedFile ? selectedFile.name : '';
  });
  fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('dragover'); });
  fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('dragover'));
  fileDrop.addEventListener('drop', e => {
    e.preventDefault();
    fileDrop.classList.remove('dragover');
    selectedFile = e.dataTransfer.files[0] || null;
    $('fileName').textContent = selectedFile ? selectedFile.name : '';
  });

  function showStatus(type, html) {
    const el = $('statusMsg');
    el.className = `alert ${type} show`;
    el.innerHTML = html;
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function gzipBytes(data) {
    const cs = new CompressionStream('gzip');
    const writer = cs.writable.getWriter();
    writer.write(data instanceof Uint8Array ? data : new TextEncoder().encode(data));
    writer.close();
    const chunks = [];
    const reader = cs.readable.getReader();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
    }
    const total = chunks.reduce((n, c) => n + c.length, 0);
    const out = new Uint8Array(total);
    let off = 0;
    for (const c of chunks) { out.set(c, off); off += c.length; }
    return out;
  }

  $('submitBtn').addEventListener('click', async () => {
    const customerId = $('customerId').value.trim();
    const domain = $('domain').value.trim() || 'collect';
    const token = $('token').value.trim();
    const contentType = $('contentType').value;
    const method = document.querySelector('input[name="method"]:checked').value;

    if (!customerId || !token) {
      showStatus('error', 'Customer ID and Bearer Token are required.');
      return;
    }

    const endpoint = `https://${customerId}.${domain}.observeinc.com/v1/http`;
    let data = null;
    let sourceLabel = '';

    try {
      if (method === 'file') {
        if (!selectedFile) { showStatus('error', 'Please select a file.'); return; }
        data = new Uint8Array(await selectedFile.arrayBuffer());
        sourceLabel = selectedFile.name;
      } else if (method === 'url') {
        const url = $('urlInput').value.trim();
        if (!url) { showStatus('error', 'Please enter a URL.'); return; }
        showStatus('info', 'Fetching file from URL…');
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Failed to fetch URL: HTTP ${res.status}`);
        data = new Uint8Array(await res.arrayBuffer());
        sourceLabel = url;
      } else {
        const text = $('pasteInput').value;
        if (!text.trim()) { showStatus('error', 'Please paste some data.'); return; }
        data = new TextEncoder().encode(text);
        sourceLabel = `${data.length.toLocaleString()} bytes pasted`;
      }

      showStatus('info', `Compressing and sending ${data.length.toLocaleString()} bytes to <code>${endpoint}</code>…`);
      $('submitBtn').disabled = true;

      const compressed = await gzipBytes(data);

      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': contentType,
          'Content-Encoding': 'gzip',
        },
        body: compressed,
      });

      $('submitBtn').disabled = false;

      if (!resp.ok) {
        const body = await resp.text();
        throw new Error(`HTTP ${resp.status}: ${body}`);
      }

      showStatus('success',
        `Sent successfully — HTTP ${resp.status} &nbsp;|&nbsp; Source: ${sourceLabel} &nbsp;|&nbsp; Endpoint: <code>${endpoint}</code>`
      );
    } catch (err) {
      $('submitBtn').disabled = false;
      showStatus('error', err.message || String(err));
    }
  });
</script>
</body>
</html>
